# Keeps the SHA-pinned actions, the digest-pinned base image and the test-only browser tooling
# current. The app itself has no npm dependencies (test/supply-chain.test.js enforces that).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let a new release age a week before adopting it: most hijacked releases are caught by then.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: docker

  # test/browser only: Playwright for the browser checks. Never part of the app.
  - package-ecosystem: npm
    directory: /test/browser
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: test
